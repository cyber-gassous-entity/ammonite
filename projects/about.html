<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMMONITE | ABOUT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="scrollable">

    <!-- CUSTOM CURSOR -->
    <div id="cursor">
        <div class="cursor-tool"></div>
    </div>

    <!-- 4-CORNER NAVIGATION -->
    <a href="index.html" class="nav-corner nav-tl logo inter hover-trig" id="logo-text">AMMONITE</a>
    <a class="nav-corner nav-tr logo inter" id="mode-text">ARCHITECTURE</a>
    <a href="archive.html" class="nav-corner nav-bl hover-trig">ARCHIVE</a>
    <a href="about.html" class="nav-corner nav-br hover-trig text-active">INFO</a>

    <!-- MAIN CONTENT -->
    <main>

        <div class="split-grid">

            <!-- LEFT: STICKY IMAGE -->
            <div>
                <!-- We will load an image here dynamically from info/data.txt, or use a default placeholder -->
                <img id="about-img" src="" class="split-img" alt="Ammonite Studio">
            </div>

            <!-- RIGHT: TEXT -->
            <div class="split-text inter">
                <div class="mono" style="opacity: 0.5; margin-bottom: 20px;">[ INFO ]</div>
                <div id="about-text">
                    LOADING INFO...
                </div>

                <div
                    style="margin-top: 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; text-transform: uppercase;">
                    <!-- HQ 1 -->
                    <div>
                        <div id="c-hq1-title" class="mono" style="opacity:0.5; margin-bottom:10px;">---</div>
                        <div id="c-hq1-body" class="bold" style="font-size: 1.1rem; line-height: 1.4;">---</div>
                    </div>
                    <!-- HQ 2 -->
                    <div>
                        <div id="c-hq2-title" class="mono" style="opacity:0.5; margin-bottom:10px;">---</div>
                        <div id="c-hq2-body" class="bold" style="font-size: 1.1rem; line-height: 1.4;">---</div>
                    </div>
                    <!-- DIGITAL -->
                    <div style="grid-column: span 2; margin-top: 20px;">
                        <div class="mono" style="opacity:0.5; margin-bottom:10px;">DIGITAL</div>
                        <a id="c-email" href="#" class="bold hover-trig"
                            style="font-size: 1.5rem; text-decoration: underline; color: var(--ink);">---</a>
                        <br><br>
                        <a id="c-insta" href="#" class="hover-trig" style="font-size: 1.1rem;">---</a>
                    </div>
                </div>

            </div>
        </div>

    </main>



    <!-- LOGIC -->
    <script src="about.js"></script>

</body>

</html>
